[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-wild"
version = "0.1.0"
description = "Reproducible robustness analysis for monocular depth estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "torch>=2.1",
  "transformers>=4.45,<5",
  "safetensors>=0.4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
demo = ["gradio>=5,<7"]

[project.scripts]
depth-wild-perturb = "depth_wild.perturb:main"
depth-wild-infer = "depth_wild.infer:main"
depth-wild-evaluate = "depth_wild.evaluate:main"
depth-wild-plot = "depth_wild.plot:main"
depth-wild-compare = "depth_wild.compare:main"
depth-wild-demo = "depth_wild.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
